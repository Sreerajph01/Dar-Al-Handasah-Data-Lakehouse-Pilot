# =============================================================================
# docker-compose.governance.yml — Data Governance services
# OpenMetadata catalog + lineage, Kong API gateway (DB-less)
# =============================================================================

services:

  # ─── OpenMetadata server ──────────────────────────────────────────────────
  openmetadata:
    image: docker.getcollate.io/openmetadata/server:${OPENMETADATA_VERSION:-2.0.3}
    container_name: dar-openmetadata
    restart: unless-stopped
    environment:
      # Database
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_USE_SSL: "false"
      DB_HOST: postgres-meta
      DB_PORT: "5432"
      DB_DATABASE: "${OM_DB}"
      DB_USER: "${OM_DB_USER}"
      DB_USER_PASSWORD: "${OM_DB_PASSWORD}"
      # OpenSearch
      SEARCH_TYPE: opensearch
      ELASTICSEARCH_HOST: opensearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: http
      ELASTICSEARCH_USER: admin
      ELASTICSEARCH_PASSWORD: "${OPENSEARCH_INITIAL_ADMIN_PASSWORD}"
      ELASTICSEARCH_INDEX_PREFIX: om
      # Pipeline service
      PIPELINE_SERVICE_CLIENT_ENDPOINT: "http://openmetadata-ingestion:8080"
      PIPELINE_SERVICE_CLIENT_VERIFY_SSL: "no-ssl"
      # Auth (Keycloak OIDC — enabled in M5; basic auth for M1)
      AUTHENTICATION_PROVIDER: basic
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_CONTAINER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      AUTHORIZER_ADMIN_PRINCIPALS: "[admin]"
      AUTHORIZER_INGESTION_PRINCIPALS: "[ingestion-bot]"
      JWT_ISSUER: "open-metadata.org"
      JWT_KEY_ID: "Gb389a-9f76-gdjs-a92j-0242bk94356"
      RSA_PUBLIC_KEY_FILE_PATH: "./conf/public_key.der"
      RSA_PRIVATE_KEY_FILE_PATH: "./conf/private_key.der"
      # Airflow lineage
      AIRFLOW_HOST: "http://airflow-webserver:8080"
    ports:
      - "${OPENMETADATA_PORT:-8585}:8585"
    depends_on:
      postgres-meta:
        condition: service_started
      opensearch:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8586/healthcheck || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 20
      start_period: 180s
    networks:
      - lakehouse-net

  # ─── OpenMetadata ingestion ───────────────────────────────────────────────
  # This runs the OpenMetadata-bundled Airflow scheduler that manages OM
  # pipeline DAGs. It is NOT our project Airflow — it uses postgres-meta as
  # its own backend and has its own web UI on port 8080.
  openmetadata-ingestion:
    image: docker.getcollate.io/openmetadata/ingestion:${OPENMETADATA_VERSION:-2.0.3}
    container_name: dar-openmetadata-ingestion
    restart: unless-stopped
    # 'scheduler' starts the bundled Airflow scheduler.
    # Without this the entrypoint calls 'airflow' with no args → prints help → exits.
    command: scheduler
    environment:
      # OM pipeline service — points to the OM server for deploying pipeline DAGs
      OPENMETADATA_SERVER_URL: "http://openmetadata:8585"
      PIPELINE_SERVICE_CLIENT_ENDPOINT: "http://openmetadata-ingestion:8080"
      SERVER_HOST: openmetadata
      SERVER_PORT: "8585"
      # Airflow DB backend (uses the shared postgres-meta database)
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${OM_DB_USER}:${OM_DB_PASSWORD}@postgres-meta:5432/${OM_AIRFLOW_DB:-airflow_om}"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      # Initialise the bundled Airflow DB on first start
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: "${AIRFLOW_WEBSERVER_SECRET}"
      # OM metadata pipeline credentials (for connecting back to OM server)
      AIRFLOW_HOST: "http://openmetadata-ingestion:8080"
      AIRFLOW_USERNAME: admin
      AIRFLOW_PASSWORD: "${AIRFLOW_WEBSERVER_SECRET}"
    depends_on:
      openmetadata:
        condition: service_started
      postgres-meta:
        condition: service_started
    healthcheck:
      # No webserver in scheduler-only mode — use Airflow's built-in heartbeat check
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 120s
    networks:
      - lakehouse-net

networks:
  lakehouse-net:
    name: dar-lakehouse_default
