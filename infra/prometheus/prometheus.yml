global:
  scrape_interval:     30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'trino'
    metrics_path: /v1/jmx/mbean/trino.execution%3Aname%3DQueryManager
    static_configs:
      - targets: ['trino:8080']

  - job_name: 'opensearch'
    static_configs:
      - targets: ['opensearch:9600']   # OpenSearch Performance Analyzer

  - job_name: 'airflow'
    metrics_path: /metrics
    static_configs:
      - targets: ['airflow-webserver:8080']

  - job_name: 'fluent-bit'
    static_configs:
      - targets: ['fluent-bit:2020']
