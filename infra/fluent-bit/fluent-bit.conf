[SERVICE]
    Flush         5
    Log_Level     warn
    Daemon        off
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Tag               docker.*
    Refresh_Interval  10
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On

[FILTER]
    Name                kubernetes
    Match               docker.*
    Merge_Log           On
    Merge_Log_Key       log_processed
    K8S-Logging.Parser  On
    K8S-Logging.Exclude Off

[OUTPUT]
    Name          opensearch
    Match         docker.*
    Host          opensearch
    Port          9200
    HTTP_User     admin
    HTTP_Passwd   ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    Suppress_Type_Name On
    Index         audit-logs
    Replace_Dots  On
    Retry_Limit   5
    tls           Off
    tls.verify    Off
