# OPA access control for Trino
# Built-in OPA access control provider (available since Trino 395)
# Docs: https://trino.io/docs/current/security/opa-access-control.html
access-control.name=opa
opa.policy.uri=http://opa:8282/v1/data/trino/allow
opa.policy.row-filters-uri=http://opa:8282/v1/data/trino/rowFilters
opa.policy.column-masking-uri=http://opa:8282/v1/data/trino/columnMask
# Log denied decisions for audit
opa.log-requests=true
opa.log-responses=true
# Timeout settings
opa.http-client.connect-timeout=5s
opa.http-client.request-timeout=10s
