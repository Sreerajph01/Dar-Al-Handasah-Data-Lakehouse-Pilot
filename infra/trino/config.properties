# Trino coordinator configuration
# Deployed as single-node (coordinator = worker) for local demo
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
query.max-memory=6GB
query.max-memory-per-node=4GB
# Task concurrency tuned for 64 GB host
task.concurrency=8
task.max-worker-threads=16
# Access control: OPA (row filters + column masks)
# access-control.config-files points to opa.properties
