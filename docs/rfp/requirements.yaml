- Nb: '24'
  Requirement: "The proposed design shall support the non-disruptive addition of a\
    \ cold storage tier \u2014 deployed on independent, lower-cost hardware and located\
    \ in a physically separate site/region with WAN-class connectivity \u2014 without\
    \ migration, re-architecture, or downtime of the primary (hot) tier. Objects transitioned\
    \ or written to the cold tier shall remain addressable through the S3 namespace\
    \ and retrievable without a manual restore workflow. The cold tier shall support\
    \ sustained sequential read throughput suitable for bulk text-extraction workloads;\
    \ the bidder shall state the sustained aggregate read throughput of the proposed\
    \ cold-tier reference architecture. As part of the technical evaluation, we might\
    \ request the bidder to demonstrate this capability in a proof of concept (tier\
    \ registration, tag-based transition, transparent retrieval via original key,\
    \ batch sequential read). Cold-tier provisioning is excluded from the scope and\
    \ capacity planning of this RFP; however, the bidder shall state the licensing\
    \ model and unit-pricing mechanism applicable to future cold-tier capacity. The\
    \ initial deployment targets 70\u2013100 TB of usable hot-tier capacity (post\
    \ erasure-coding/replication overhead; the bidder shall state the proposed erasure-coding\
    \ profile and the resulting raw-to-usable ratio)"
- Nb: '25'
  Requirement: "The cold tier shall be suitable for long-term retention of inactive\
    \ documents migrated from enterprise content sources (SharePoint farms, network\
    \ file shares), including support for: (a) write-once/direct-write ingestion into\
    \ the cold tier without staging through the hot tier; (b) object immutability\
    \ / retention locks (S3 Object Lock or equivalent, governance and compliance modes)\
    \ to satisfy regulatory retention requirements; (c) preservation of source path,\
    \ ownership, ACL snapshot, and retention classification per object \u2014 via\
    \ object metadata, object tagging, and/or an associated manifest object or catalog\
    \ record"
