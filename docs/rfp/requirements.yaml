requirements:
- id: RFP-01
  area: Platform Architecture & Technology
  text: "The solution architecture shall support a unified model for storing and processing\
    \ structured, semi\u2011structured, and unstructured data, with consistent governance,\
    \ security controls, and metadata management across all formats."
  status: Partially Compliant
  component: OpenMetadata
  classification: Documented
- id: RFP-02
  area: Platform Architecture & Technology
  text: "The solution should provide native, pre\u2011built connectors to a wide range\
    \ of enterprise data sources, including but not limited to relational and NoSQL\
    \ databases, Microsoft Dynamics 365 (Finance & Operations and/or CRM) (On-Prem\
    \ and Online), network drives, and email systems, Microsoft SharePoint (Online\
    \ and On\u2011Prem), Salesforce CRM, file\u2011based sources, APIs, and Generative\
    \ AI / Machine Learning models or endpoints, enabling seamless data ingestion\
    \ without extensive custom development."
  status: Compliant via Third-Party
  component: Airbyte Self-Managed
  classification: Documented
- id: RFP-03
  area: Platform Architecture & Technology
  text: The solution should be easily interfaced with other solutions using standard
    topologies such as API calls/ staging tables / flat file/ DB linking
  status: Fully Compliant
  component: TBD
  classification: Documented
- id: RFP-04
  area: Platform Architecture & Technology
  text: The supplier shall provide clear technical architecture diagrams for ingesting
    structured, semi-structured, unstructured data.
  status: Fully Compliant
  component: TBD
  classification: Documented
- id: RFP-05
  area: Platform Architecture & Technology
  text: The solution should support integrating the data catalogue with BI tools to
    support self-service analysis and enforcing security roles and permissions, ensuring
    that end users can independently access, query, and visualize trusted data, they
    have access to, without relying on IT bottlenecks.
  status: Partially Compliant
  component: Apache Superset
  classification: Documented
- id: RFP-06
  area: Platform Architecture & Technology
  text: The proposed solution should be modular, with clear description provided on
    each module, and DAR AL HANDSAH has the option of selecting the modules relevant
    to the agreed-on scope. Modular approach should be reflected in the financial
    proposal as well.
  status: Fully Compliant
  component: TBD
  classification: Documented
- id: RFP-07
  area: Platform Architecture & Technology
  text: "The solution should support a backup and recovery plan to maintain the integrity\
    \ and availability of the Dar\u2019s information assets."
  status: Partially Compliant
  component: Velero
  classification: Documented
- id: RFP-08
  area: Platform Architecture & Technology
  text: The solution must provide event streaming features (based on KAFKA or other
    technologies)
  status: Compliant via Third-Party
  component: Apache Kafka
  classification: Documented
- id: RFP-09
  area: Platform Architecture & Technology
  text: The solution must support for massive-scale data querying and transformation.
    This includes capabilities to query or integrate data from distributed unstructured
    data sources. (e.g., Apache Spark, Trino, Presto, etc...).
  status: Fully Compliant
  component: TBD
  classification: Documented
- id: RFP-10
  area: Platform Architecture & Technology
  text: The solution, natively or integrated, can support Graph, Time-Series, and
    Vector databases
  status: Partially Compliant
  component: Apache AGE / InfluxDB OSS
  classification: Documented
- id: RFP-11
  area: Platform Architecture & Technology
  text: "The solution shall operate efficiently and maintain consistent performance\
    \ when deployed on thin\u2011provisioned storage infrastructure, supporting dynamic\
    \ storage allocation without degradation in system performance or stability."
  status: Fully Compliant
  component: TBD
  classification: Documented
- id: RFP-12
  area: Platform Architecture & Technology
  text: The solution must support full HA without any single point of failure in the
    architecture.
  status: Fully Compliant
  component: TBD
  classification: Documented
- id: RFP-13
  area: Platform Architecture & Technology
  text: Any work/effort/Parameterization/HW/SW required from Dar Al Handsah infrastructure
    team must be clearly highlighted and agreed upon jointly.
  status: Fully Compliant
  component: TBD
  classification: Documented
- id: RFP-14
  area: Platform Architecture & Technology
  text: There must be proper support in place to ensure solution provider intervention
    whenever support is needed. Appropriate SLAs to be considered depending on criticality
    (vulnerability, DR, site failure, DC failure, Data corruption, etc.). solution
    provider must support/certify in case of patch deployment and underlying product
    upgrade/migration
  status: Fully Compliant
  component: TBD
  classification: Documented
- id: RFP-15
  area: Platform Architecture & Technology
  text: All Proposed components as part of the proposal (HW, SW, license, etc.) must
    not have end of life / end of support for the period of minimum another 4 years
    from date of purchase
  status: Fully Compliant
  component: TBD
  classification: Documented
- id: RFP-16
  area: Platform Architecture & Technology
  text: 'Number of Infrastructure environments: 1- Phase 1 Test/Dev UAT (Pilot), 2-
    Phase 2 Prod. The proposed solution/Setup/Sizing/Licensing must consider provisioning
    of environments'
  status: Fully Compliant
  component: TBD
  classification: Documented
- id: RFP-17
  area: Platform Architecture & Technology
  text: The solution must support encrypted data replication between solution components
  status: Fully Compliant
  component: TBD
  classification: Documented
- id: RFP-18
  area: Platform Architecture & Technology
  text: The solution supports medallion architecture
  status: Fully Compliant
  component: TBD
  classification: Documented
- id: RFP-19
  area: Platform Architecture & Technology
  text: The solution shall define the conceptual model, which determine the high-level
    structure of the data Lakehouse, including key entities and relationships, and
    ensure the model aligns with business objectives and data requirements.
  status: Partially Compliant
  component: dbt
  classification: Documented
- id: RFP-20
  area: Platform Architecture & Technology
  text: The solution shall define the logical model which specifies the data structures,
    including tables, columns, and relationships.
  status: Partially Compliant
  component: dbt
  classification: Documented
- id: RFP-21
  area: Platform Architecture & Technology
  text: The solution shall define the physical model which specify how data will be
    stored, including indexing, partitioning, and storage formats, which Optimize
    for efficient data retrieval and storage management.
  status: Fully Compliant
  component: TBD
  classification: Documented
- id: RFP-22
  area: Platform Architecture & Technology
  text: The proposed object storage platform shall expose an S3-compatible API including
    bucket versioning, object tagging, and S3 Lifecycle Management with support for
    transition rules based on object age, prefix, and tags.
  status: Fully Compliant
  component: TBD
  classification: Documented
- id: RFP-23
  area: Platform Architecture & Technology
  text: The platform's IAM/authorization model shall support integration with the
    organization's central identity provider (AD / Entra ID) and shall apply uniformly
    across all current and future storage tiers and sites, including tiers that receive
    data via direct write rather than lifecycle transition
  status: Fully Compliant
  component: TBD
  classification: Documented
- id: RFP-24
  area: Platform Architecture & Technology
  text: "The proposed design shall support the non-disruptive addition of a cold storage\
    \ tier \u2014 deployed on independent, lower-cost hardware and located in a physically\
    \ separate site/region with WAN-class connectivity \u2014 without migration, re-architecture,\
    \ or downtime of the primary (hot) tier. Objects transitioned or written to the\
    \ cold tier shall remain addressable through the S3 namespace and retrievable\
    \ without a manual restore workflow. The cold tier shall support sustained sequential\
    \ read throughput suitable for bulk text-extraction workloads; the bidder shall\
    \ state the sustained aggregate read throughput of the proposed cold-tier reference\
    \ architecture. As part of the technical evaluation, we might request the bidder\
    \ to demonstrate this capability in a proof of concept (tier registration, tag-based\
    \ transition, transparent retrieval via original key, batch sequential read).\
    \ Cold-tier provisioning is excluded from the scope and capacity planning of this\
    \ RFP; however, the bidder shall state the licensing model and unit-pricing mechanism\
    \ applicable to future cold-tier capacity. The initial deployment targets 70\u2013\
    100 TB of usable hot-tier capacity (post erasure-coding/replication overhead;\
    \ the bidder shall state the proposed erasure-coding profile and the resulting\
    \ raw-to-usable ratio)"
  status: Fully Compliant
  component: TBD
  classification: Documented
- id: RFP-25
  area: Platform Architecture & Technology
  text: "The cold tier shall be suitable for long-term retention of inactive documents\
    \ migrated from enterprise content sources (SharePoint farms, network file shares),\
    \ including support for: (a) write-once/direct-write ingestion into the cold tier\
    \ without staging through the hot tier; (b) object immutability / retention locks\
    \ (S3 Object Lock or equivalent, governance and compliance modes) to satisfy regulatory\
    \ retention requirements; (c) preservation of source path, ownership, ACL snapshot,\
    \ and retention classification per object \u2014 via object metadata, object tagging,\
    \ and/or an associated manifest object or catalog record"
  status: Fully Compliant
  component: TBD
  classification: Documented
- id: RFP-26
  area: Platform Architecture & Technology
  text: The platform shall support asynchronous cross-region replication with configurable
    bandwidth throttling or equivalent traffic-shaping/scheduling controls and with
    observable replication backlog metrics, such that WAN links are not saturated
    by tiering or replication traffic.
  status: Fully Compliant
  component: TBD
  classification: Documented
- id: RFP-27
  area: Integration & Data Ingestion
  text: "The solution is Capable of ingesting semi-structured (e.g. geographic information,\
    \ log files, \u2026.), unstructured (e.g. video, images, PDFs, Office Docs, Engineering\
    \ Docs such as Revit and Cad Drawings)."
